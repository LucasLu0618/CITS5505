<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - KidCode Hub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">
      <a href="/">KidCode Hub</a>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/courses">Courses</a></li>
        <li><a href="/showcase">Showcase</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/register">Register</a></li>
      </ul>
    </nav>
  </header>

  <!-- Register Section -->
  <main class="login-page">
    <section class="login-section">
      <div class="login-card">
        <h1 class="gradient-text">Create Account</h1>
        <p class="login-subtitle">Join us and start your coding journey!</p>

        {% if error %}
          <p class="error-message">{{ error }}</p>
        {% endif %}

        <form class="login-form" action="{{ url_for('register') }}" method="post">

          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="">Select your role</option>
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
            </select>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
          </div>

          <div class="form-group">
            <label for="confirm">Confirm Password</label>
            <input type="password" id="confirm" name="confirm" placeholder="Confirm your password" required>
          </div>

          <button type="submit" class="btn btn-green login-btn">Register</button>
        </form>

        <p class="register-link">
          Already have an account?
          <a href="/login">Login here</a>
        </p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>2026 KidCode Hub. Designed by Lucas, Sagar and Shee.</p>
  </footer>

</body>
</html>
